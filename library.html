<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>共享書庫</title>
<style>
  :root {
    --bg:#faf7f5; --card:#fff; --ink:#24201d; --muted:#857c76; --line:#ece6e1;
    --accent:#1db446; --warm:#e67e22; --chip:#f1ebe6; --chip-on:#24201d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  header { padding:20px 16px 8px; }
  h1 { margin:0; font-size:22px; letter-spacing:.02em; }
  .sub { margin-top:4px; color:var(--muted); font-size:13px; }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 16px 10px;
    border-bottom:1px solid transparent; transition:border-color .2s; }
  .bar.stuck { border-bottom-color:var(--line); }
  .search { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px;
    background:#fff; font-size:16px; outline:none; }
  .search:focus { border-color:#cfc5bd; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-top:10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; border-radius:999px; padding:7px 13px; font-size:13px;
    background:var(--chip); color:var(--ink); cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--chip-on); color:#fff; }
  .count { padding:10px 16px 0; color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px 10px; padding:10px 16px 40px; }
  @media (min-width:600px) { .grid { grid-template-columns:repeat(5, 1fr); } }
  .book { display:block; width:100%; align-self:start; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:inherit; font:inherit; }
  .cover { position:relative; aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:#e9e2dc;
    box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:8px;
    font-size:12px; line-height:1.35; text-align:center; color:#5d544e; font-weight:600;
    overflow:hidden; word-break:break-all; }
  .badge { position:absolute; left:5px; bottom:5px; font-size:10px; padding:2px 6px; border-radius:4px;
    background:rgba(230,126,34,.95); color:#fff; }
  .badge.mine { background:rgba(36,32,29,.8); left:auto; right:5px; }
  .t { margin-top:6px; font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden; }
  .o { margin-top:2px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msg { padding:60px 24px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7; }
  /* 詳細資料 */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:#fff; border-radius:18px 18px 0 0;
    max-height:88vh; overflow:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease; }
  .sheet.open { transform:none; }
  .sheet-bg.open { display:block; }
  .grab { width:36px; height:4px; border-radius:2px; background:#ddd; margin:0 auto 14px; }
  .d-top { display:flex; gap:14px; }
  .d-cover { flex:none; width:96px; }
  .d-title { font-size:17px; font-weight:700; line-height:1.4; }
  .d-meta { margin-top:4px; font-size:13px; color:var(--muted); line-height:1.6; }
  .d-status { display:inline-block; margin-top:6px; font-size:12px; font-weight:600; padding:3px 9px;
    border-radius:999px; background:#e8f7ec; color:var(--accent); }
  .d-status.busy { background:#fdf0e4; color:var(--warm); }
  .d-sum { margin-top:14px; font-size:14px; line-height:1.75; color:#3d3632; white-space:pre-line; }
  .d-actions { display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .btn { display:block; text-align:center; text-decoration:none; padding:12px; border-radius:12px;
    font-size:15px; font-weight:600; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  .hint { margin-top:10px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>📚 共享書庫</h1>
  <div class="sub" id="sub">載入中…</div>
</header>
<div class="bar" id="bar">
  <input class="search" id="q" type="search" placeholder="搜尋書名、作者" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg" hidden></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
  // ★ Supabase「library」函式的網址
  const ENDPOINT = 'https://obbeopbugmphefasevia.supabase.co/functions/v1/library';

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // 一律用 textContent，書名不會被當成 HTML
    return e;
  };
  const statusText = b => b.status === 'available' ? '可借閱'
    : b.status === 'self_reading' ? (b.mine ? '閱讀中（你）' : '書主閱讀中')
    : `借閱中（${b.holder_is_me ? '你' : (b.holder || '?')}）`;

  let books = [], lineId = '', filter = 'all', query = '';

  function coverEl(b, cls) {
    const box = el('div', cls || 'cover');
    if (b.cover) {
      const img = el('img');
      img.loading = 'lazy';
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.src = b.cover;
      img.onerror = () => { img.remove(); box.prepend(el('div', 'ph', b.title)); };
      box.appendChild(img);
    } else {
      box.appendChild(el('div', 'ph', b.title));
    }
    return box;
  }

  function renderChips() {
    const owners = [...new Set(books.filter(b => !b.mine).map(b => b.owner))];
    const opts = [['all', '全部'], ['available', '可借'], ['mine', '我的書'], ['borrowed', '我借來的'],
                  ...owners.map(o => ['owner:' + o, o])];
    const box = $('chips');
    box.textContent = '';
    for (const [key, label] of opts) {
      const c = el('button', 'chip' + (filter === key ? ' on' : ''), label);
      c.onclick = () => { filter = key; renderChips(); renderGrid(); };
      box.appendChild(c);
    }
  }

  function visible() {
    const q = query.trim().toLowerCase();
    return books.filter(b => {
      if (filter === 'available' && (b.status !== 'available' || b.mine)) return false;
      if (filter === 'mine' && !b.mine) return false;
      if (filter === 'borrowed' && !b.holder_is_me) return false;
      if (filter.startsWith('owner:') && b.owner !== filter.slice(6)) return false;
      if (q && !((b.title || '') + ' ' + (b.author || '')).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function renderGrid() {
    const list = visible();
    const grid = $('grid');
    grid.textContent = '';
    $('count').textContent = `${list.length} 本`;
    $('msg').hidden = list.length > 0;
    if (!list.length) $('msg').textContent = books.length ? '沒有符合的書' : '書庫裡還沒有書。在 LINE 輸入「匯入」就能一次加入讀墨書櫃。';
    const frag = document.createDocumentFragment();
    for (const b of list) {
      const card = el('button', 'book');
      const cov = coverEl(b);
      if (b.status !== 'available') cov.appendChild(el('span', 'badge', b.status === 'self_reading' ? '閱讀中' : (b.mine ? '借出' : '借閱中')));
      if (b.mine) cov.appendChild(el('span', 'badge mine', '我的'));
      card.append(cov, el('div', 't', b.title), el('div', 'o', b.mine ? '我' : b.owner));
      card.onclick = () => openSheet(b);
      frag.appendChild(card);
    }
    grid.appendChild(frag);
  }

  function openSheet(b) {
    const s = $('sheet');
    s.textContent = '';
    s.appendChild(el('div', 'grab'));
    const top = el('div', 'd-top');
    top.appendChild(coverEl(b, 'cover d-cover'));
    const info = el('div');
    info.appendChild(el('div', 'd-title', b.title));
    info.appendChild(el('div', 'd-meta', [b.author, b.category].filter(Boolean).join('・')));
    info.appendChild(el('div', 'd-meta', '書主：' + (b.mine ? '我' : b.owner)));
    info.appendChild(el('span', 'd-status' + (b.status === 'available' ? '' : ' busy'), statusText(b)));
    top.appendChild(info);
    s.appendChild(top);
    if (b.summary) s.appendChild(el('div', 'd-sum', b.summary));

    const acts = el('div', 'd-actions');
    if (lineId && !b.mine && b.status === 'available') {
      const a = el('a', 'btn primary', '在 LINE 借這本');
      // 打開和機器人的聊天室並帶入書名，送出後會出現有「我想借這本書」按鈕的卡片
      a.href = `https://line.me/R/oaMessage/${encodeURIComponent(lineId)}/?${encodeURIComponent(b.title)}`;
      acts.appendChild(a);
    }
    if (b.url) {
      const a = el('a', 'btn ghost', '到讀墨看完整介紹');
      a.href = b.url;
      a.target = '_blank';
      a.rel = 'noopener';
      acts.appendChild(a);
    }
    if (acts.childNodes.length) s.appendChild(acts);
    if (lineId && !b.mine && b.status === 'available') {
      s.appendChild(el('div', 'hint', '會回到 LINE 並帶入書名，按送出後點「我想借這本書」'));
    }
    $('sheetBg').classList.add('open');
    requestAnimationFrame(() => s.classList.add('open'));
  }
  function closeSheet() {
    $('sheet').classList.remove('open');
    $('sheetBg').classList.remove('open');
  }
  $('sheetBg').onclick = closeSheet;

  $('q').addEventListener('input', e => { query = e.target.value; renderGrid(); });
  new IntersectionObserver(([e]) => $('bar').classList.toggle('stuck', !e.isIntersecting))
    .observe(document.querySelector('header'));

  function fail(text) {
    $('sub').textContent = '';
    $('bar').hidden = true;
    $('msg').hidden = false;
    $('msg').textContent = text;
  }

  (async () => {
    const t = new URLSearchParams(location.search).get('t');
    if (!t) return fail('請從 LINE 輸入「書庫」取得專屬連結。');
    try {
      const res = await fetch(`${ENDPOINT}?t=${encodeURIComponent(t)}`);
      const data = await res.json();
      if (!data.ok) return fail(data.error || '載入失敗');
      books = data.books || [];
      lineId = data.line_basic_id || '';
      const owners = new Set(books.map(b => b.owner)).size;
      $('sub').textContent = `${data.viewer}・${(data.groups || []).join('、') || '尚未加入群組'}・${owners} 位書主・${books.length} 本`;
      renderChips();
      renderGrid();
    } catch (e) {
      fail('連不上伺服器，請稍後再試。');
    }
  })();
</script>
</body>
</html>
